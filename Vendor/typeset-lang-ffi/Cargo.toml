[package]
name = "typeset-lang-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
base64 = "0.22"
# Pinned to the exact version Typst depends on so `comemo::evict` operates on the
# same (process-global) incremental cache that `typst::compile` populates.
comemo = "=0.5.1"
libc = "0.2"
# Reading font files: mapping them rather than loading them (see `FileFont`),
# and listing the faces of a collection.
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
ttf-parser = { version = "0.25", default-features = false }
serde_json = "1"
typstyle-core = { version = "=0.14.0", default-features = false }
# Typstyle 0.14 formats Typst 0.14 syntax trees. Keep this alias separate from
# the app's newer embedded Typst compiler; formatting is text-in/text-out.
typst-syntax-format = { package = "typst-syntax", version = "=0.14.2" }
typst = { path = "../typst/crates/typst" }
typst-ide = { path = "../typst/crates/typst-ide" }
typst-kit = { path = "../typst/crates/typst-kit", features = [
    "datetime",
    "embedded-fonts",
    "scan-fonts",
    "system-downloader",
    "system-packages",
    "universe-packages",
] }
typst-layout = { path = "../typst/crates/typst-layout" }
typst-html = { path = "../typst/crates/typst-html" }
typst-pdf = { path = "../typst/crates/typst-pdf" }
typst-svg = { path = "../typst/crates/typst-svg" }
typst-syntax = { path = "../typst/crates/typst-syntax" }

# Finding the system's fonts through Core Text (see `core_text_fonts`). Both of
# these, like the two above, are already in the tree via typst and typst-kit.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = "0.10"
fontdb = { version = "0.23", default-features = false, features = ["memmap"] }

[dev-dependencies]
# Supplies real font bytes for the project-font discovery tests (the same
# crate the embedded fonts come from, so no extra download).
typst-assets = { version = "0.15.1", features = ["fonts"] }
