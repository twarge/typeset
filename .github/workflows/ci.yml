name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    steps:
      # The build phases can check the submodule out themselves, but doing it
      # here keeps the network work out of the build.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          cargo --version

      # xcodebuild builds the dependencies itself: TypesetCore's first build
      # phase produces TypesetLang.xcframework and the app target's builds the
      # bundled Typst CLI.
      - name: Build and test
        run: |
          xcodebuild \
            -project Typeset.xcodeproj \
            -scheme Typeset \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/Xcode \
            CODE_SIGNING_ALLOWED=NO \
            test
