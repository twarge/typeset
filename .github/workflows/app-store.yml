name: App Store

# Archives the iOS app and uploads it to App Store Connect (TestFlight).
# Run it manually from the Actions tab, or push a version tag like v1.4.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  App Store Connect issuer ID
#   ASC_KEY_P8     Contents of the AuthKey_<KEYID>.p8 file
# Create the key at App Store Connect → Users and Access → Integrations →
# App Store Connect API, with the App Manager role (needed for cloud signing).
#
# Signing is fully cloud-managed: xcodebuild uses the API key to create and
# fetch the distribution certificate and profile, and App Store Connect
# manages the build number so uploads never collide. macOS is deliberately
# absent here — it ships Developer ID outside the App Store.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  # Never cancel a run that may have already uploaded a build number.
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload iOS
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      # The Vendor/typst submodule is required: the language framework's FFI
      # crate reaches it through path dependencies.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          xcodebuild -version
          cargo --version
          rustup --version

      # The Rust target directory is too large to cache usefully (a release
      # build of all four slices runs to several GB), but the registry keeps
      # dependency downloads off the critical path.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Vendor/typeset-lang-ffi/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8

      # xcodebuild builds the dependencies itself: TypesetCore's first build
      # phase compiles the Rust FFI crate into TypesetLang.xcframework (the
      # ensure script installs the Apple Rust targets on first use). The
      # release script archives, exports, and uploads in one pass.
      - name: Archive and upload
        env:
          APP_STORE_CONNECT_API_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: 257KW9ZJFP
          IOS_MANAGE_APP_VERSION_AND_BUILD_NUMBER: 'YES'
        run: Scripts/release-app.sh --only-ios --ios-destination upload

      - name: Save dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Typeset-iOS-dSYMs
          path: build/distribution/Typeset-iOS.xcarchive/dSYMs
          if-no-files-found: ignore
