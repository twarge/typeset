name: App Store

# Archives and uploads both apps to App Store Connect (TestFlight / review).
# Run it manually from the Actions tab, or push a version tag like v1.4.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID     App Store Connect API key ID
#   ASC_ISSUER_ID  App Store Connect issuer ID
#   ASC_KEY_P8     Contents of the AuthKey_<KEYID>.p8 file
# Create the key at App Store Connect → Users and Access → Integrations →
# App Store Connect API, with the App Manager role (needed for cloud signing).
#
# Signing is fully cloud-managed: xcodebuild uses the API key to create and
# fetch distribution certificates and profiles, and
# manageAppVersionAndBuildNumber lets it bump CFBundleVersion past whatever
# App Store Connect already has, so uploads never collide.
#
# Typeset deltas from the dexef original: the Vendor/typst submodule is
# checked out (the language framework's FFI crate reaches it through path
# dependencies), the cargo registry is cached, and MARKETING_VERSION is
# stamped from the tag so releases don't depend on bumping the project file.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload (${{ matrix.name }})
    runs-on: macos-26
    # dexef gets by with 60, but each Typeset leg also builds the Rust
    # language framework (and the macOS leg the bundled Typst CLI).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
            archive: build/Typeset-iOS.xcarchive
          - name: macOS
            destination: generic/platform=macOS
            archive: build/Typeset-macOS.xcarchive
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Vendor/typeset-lang-ffi/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_"$ASC_KEY_ID".p8

      # A tag like v1.4.1 stamps MARKETING_VERSION=1.4.1 across every target
      # (app, QuickLook extension, frameworks). Manual dispatches from a
      # branch leave the project's own version in place.
      - name: Determine marketing version
        id: version
        run: |
          VERSION=""
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Marketing version override: ${VERSION:-(project default)}"

      - name: Write export options
        run: |
          cat > build-exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive \
            -project Typeset.xcodeproj \
            -scheme Typeset \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            -archivePath '${{ matrix.archive }}' \
            ${VERSION:+MARKETING_VERSION="$VERSION"} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath '${{ matrix.archive }}' \
            -exportOptionsPlist build-exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
